<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>萤火浏览器</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1221; --line: rgb(168 222 214 / 0.14); --line-strong: rgb(168 230 216 / 0.34);
    --text: #e6eef2; --text-3: #8fa3b3; --mint: #5fe3c8; --mint-soft: rgb(95 227 200 / 0.14); --firefly: #b5f26b; --danger: #ff8b7b;
    font-family: "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; user-select: none; }
  body { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--mint) 22%, var(--firefly) 62%, transparent); opacity: 0.45; }
  button { display: grid; place-items: center; width: 30px; height: 30px; flex: none; padding: 0; border: 0; border-radius: 8px; background: none; color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--mint-soft); }
  button:disabled { opacity: 0.35; cursor: default; }
  button:focus-visible { outline: 2px solid var(--mint); outline-offset: -2px; }
  svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  form { flex: 1; min-width: 0; display: flex; }
  .addr { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: rgb(5 9 17 / 0.6); }
  .addr:focus-within { border-color: var(--line-strong); box-shadow: 0 0 0 2px var(--mint-soft); }
  .addr svg { width: 13px; height: 13px; color: var(--text-3); flex: none; }
  .addr svg.secure { color: var(--mint); }
  input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font: inherit; outline: none; user-select: text; }
  input::placeholder { color: var(--text-3); }
  .brand { display: flex; align-items: center; gap: 6px; flex: none; padding: 0 4px 0 2px; color: var(--mint); font-weight: 600; letter-spacing: 0.04em; }
  .brand i { width: 7px; height: 7px; border-radius: 50%; background: var(--firefly); box-shadow: 0 0 8px var(--firefly); }
  .agent { display: none; align-items: center; gap: 6px; flex: none; height: 26px; padding: 0 10px; border: 1px solid rgb(181 242 107 / 0.45); border-radius: 999px; color: var(--firefly); font-size: 12px; white-space: nowrap; }
  .agent.on { display: inline-flex; }
  .agent i { width: 6px; height: 6px; border-radius: 50%; background: var(--firefly); animation: pulse 1.2s ease-in-out infinite; }
  .msg { flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--danger); font-size: 12px; }
  .loading { position: fixed; left: 0; bottom: 0; height: 2px; width: 30%; background: var(--mint); box-shadow: 0 0 8px var(--mint); display: none; animation: slide 1.1s ease-in-out infinite; }
  .loading.on { display: block; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .agent i, .loading { animation: none; } }
</style>
</head>
<body>
  <span class="brand" title="萤火浏览器：Agent 和你共用的浏览器窗口"><i></i>萤火</span>
  <button id="back" type="button" title="后退" aria-label="后退" disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="forward" type="button" title="前进" aria-label="前进" disabled><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id="reload" type="button" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <button id="home" type="button" title="起始页" aria-label="起始页"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <form id="go" autocomplete="off">
    <label class="addr">
      <svg id="lock" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="url" type="text" spellcheck="false" placeholder="输入网址，或搜索" aria-label="地址栏">
    </label>
  </form>
  <span id="msg" class="msg" role="status"></span>
  <span id="agent" class="agent" title="Agent 正在操作这个窗口；你随时可以自己接管"><i></i><span id="agentText">Agent 正在操作</span></span>
  <span id="loading" class="loading" aria-hidden="true"></span>
  <script src="bar.js"></script>
</body>
</html>
